name: market-scan
on:
  schedule:
    - cron: '15 11 * * 1-5'   # 7:15 am ET (EDT); becomes 6:15 am ET after clocks change
    - cron: '30 21 * * 1-5'   # 5:30 pm ET close snapshot
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q yfinance pandas lxml
      - name: run harness
        run: |
          set -e
          python3 harness.py calendar > out/calendar.log 2>&1 || true
          python3 harness.py verify  > out/verify.txt   2>&1 || true
          python3 harness.py scan    > out/scan.txt     2>&1 || true
          python3 harness.py snapshot > out/snapshot.log 2>&1 || true
          cp data/earnings.csv out/earnings.csv 2>/dev/null || true
          cp data/verify_latest.csv out/verify_latest.csv 2>/dev/null || true
          date -u +"%Y-%m-%dT%H:%M:%SZ" > out/last_run.txt
      - name: commit outputs
        run: |
          git config user.name harness-bot
          git config user.email harness-bot@users.noreply.github.com
          git add out data/prices.csv data/earnings.csv data/pool_sp400.csv 2>/dev/null || true
          git commit -m "scan $(cat out/last_run.txt)" || echo "nothing to commit"
          git push
